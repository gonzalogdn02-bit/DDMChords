name: Deploy Blazor WASM to GitHub Pages

on:
  push:
    branches: [ "main" ] # Cambiá a "master" si tu rama principal se llama así

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish app
        run: dotnet publish DDMChords.csproj -c Release -o release --nologo

      - name: Agregar .nojekyll
        run: touch release/wwwroot/.nojekyll

      - name: Ajustar rutas para SPA
        run: cp release/wwwroot/index.html release/wwwroot/404.html

      - name: Arreglar base href
        uses: SteveSandersonMS/ghaction-rewrite-base-href@v1.1.0
        with:
          html_path: release/wwwroot/index.html
          base_href: /Acordes-DDM/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
